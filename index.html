    <script>
        "use strict";

        /* =========================================================
           DATEN
        ========================================================= */

        let currentPerson = "Bela";
        let currentImageBase64 = null;

        const defaultData = {
            Bela: [],
            Lola: []
        };

        let wishes = loadWishes();


        /* =========================================================
           DOM
        ========================================================= */

        const toast = document.getElementById("toast");
        const toastMsg = document.getElementById("toast-msg");

        const themeBtn = document.getElementById("theme-btn");
        const themeIcon = document.getElementById("theme-icon");

        const tabBela = document.getElementById("tab-bela");
        const tabLola = document.getElementById("tab-lola");

        const addWishBtn = document.getElementById("add-wish-btn");
        const wishContainer = document.getElementById("wish-container");

        const modal = document.getElementById("wish-modal");
        const modalTitle = document.getElementById("modal-title");
        const closeModalBtn = document.getElementById("close-modal-btn");

        const editIndexInput = document.getElementById("edit-index");

        const wishTitle = document.getElementById("wish-title");
        const wishDesc = document.getElementById("wish-desc");
        const wishPriority = document.getElementById("wish-priority");

        const imageInput = document.getElementById("wish-image-input");
        const chooseImageBtn = document.getElementById("choose-image-btn");
        const removeImgBtn = document.getElementById("remove-img-btn");

        const imagePreviewContainer =
            document.getElementById("image-preview-container");

        const imagePreview =
            document.getElementById("image-preview");

        const saveWishBtn =
            document.getElementById("save-wish-btn");

        const shareBtn =
            document.getElementById("share-btn");


        /* =========================================================
           START
        ========================================================= */

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            renderWishes();
        });


        /* =========================================================
           LOCAL STORAGE
        ========================================================= */

        function loadWishes() {
            try {
                const saved =
                    localStorage.getItem("christmas_wishes");

                if (!saved) {
                    return structuredClone(defaultData);
                }

                const parsed = JSON.parse(saved);

                return {
                    Bela: Array.isArray(parsed.Bela)
                        ? parsed.Bela
                        : [],

                    Lola: Array.isArray(parsed.Lola)
                        ? parsed.Lola
                        : []
                };

            } catch (error) {
                console.error("Fehler beim Laden:", error);
                return structuredClone(defaultData);
            }
        }


        function saveToStorage() {
            try {
                localStorage.setItem(
                    "christmas_wishes",
                    JSON.stringify(wishes)
                );
            } catch (error) {
                console.error("Speichern fehlgeschlagen:", error);

                showToast(
                    "Speichern fehlgeschlagen – Speicher voll?"
                );
            }
        }


        /* =========================================================
           DARK MODE
        ========================================================= */

        function initTheme() {

            const savedTheme =
                localStorage.getItem("theme");

            if (
                savedTheme === "dark" ||
                (
                    !savedTheme &&
                    window.matchMedia &&
                    window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches
                )
            ) {
                document.documentElement.classList.add("dark");
                themeIcon.textContent = "☀️";
            } else {
                document.documentElement.classList.remove("dark");
                themeIcon.textContent = "🌙";
            }
        }


        function toggleDarkMode() {

            const html = document.documentElement;

            if (html.classList.contains("dark")) {

                html.classList.remove("dark");
                localStorage.setItem("theme", "light");
                themeIcon.textContent = "🌙";

            } else {

                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                themeIcon.textContent = "☀️";

            }
        }


        themeBtn.addEventListener("click", toggleDarkMode);


        /* =========================================================
           TOAST
        ========================================================= */

        let toastTimer = null;

        function showToast(message) {

            clearTimeout(toastTimer);

            toastMsg.textContent = message;

            toast.classList.remove(
                "opacity-0",
                "-translate-y-4"
            );

            toast.classList.add(
                "opacity-100",
                "translate-y-0"
            );

            toastTimer = setTimeout(() => {

                toast.classList.remove(
                    "opacity-100",
                    "translate-y-0"
                );

                toast.classList.add(
                    "opacity-0",
                    "-translate-y-4"
                );

            }, 2500);
        }


        /* =========================================================
           PERSONEN
        ========================================================= */

        tabBela.addEventListener("click", () => {
            setPerson("Bela");
        });

        tabLola.addEventListener("click", () => {
            setPerson("Lola");
        });


        function setPerson(person) {

            currentPerson = person;

            updatePersonTabs();
            renderWishes();
        }


        function updatePersonTabs() {

            const activeClasses =
                "flex-1 py-3 rounded-xl font-bold text-sm " +
                "transition-all shadow-sm bg-white dark:bg-dark-card " +
                "text-brand-500";

            const inactiveClasses =
                "flex-1 py-3 rounded-xl font-bold text-sm " +
                "transition-all text-gray-500";

            if (currentPerson === "Bela") {

                tabBela.className = activeClasses;
                tabLola.className = inactiveClasses;

            } else {

                tabLola.className = activeClasses;
                tabBela.className = inactiveClasses;

            }
        }


        /* =========================================================
           BILDER
        ========================================================= */

        chooseImageBtn.addEventListener("click", () => {
            imageInput.click();
        });


        imageInput.addEventListener("change", handleImageUpload);


        function handleImageUpload(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {

                showToast("Bitte ein Bild auswählen.");

                imageInput.value = "";
                return;
            }


            const reader = new FileReader();

            reader.onload = function(event) {

                const img = new Image();

                img.onload = function() {

                    const canvas =
                        document.createElement("canvas");

                    const MAX_SIZE = 800;

                    let width = img.width;
                    let height = img.height;


                    if (width > height) {

                        if (width > MAX_SIZE) {
                            height =
                                height * MAX_SIZE / width;

                            width = MAX_SIZE;
                        }

                    } else {

                        if (height > MAX_SIZE) {
                            width =
                                width * MAX_SIZE / height;

                            height = MAX_SIZE;
                        }
                    }


                    canvas.width = Math.round(width);
                    canvas.height = Math.round(height);


                    const ctx =
                        canvas.getContext("2d");

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    currentImageBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    imagePreview.src =
                        currentImageBase64;

                    imagePreviewContainer.classList.remove(
                        "hidden"
                    );

                    removeImgBtn.classList.remove(
                        "hidden"
                    );
                };


                img.onerror = function() {
                    showToast("Das Bild konnte nicht geladen werden.");
                };


                img.src = event.target.result;
            };


            reader.onerror = function() {
                showToast("Das Bild konnte nicht gelesen werden.");
            };


            reader.readAsDataURL(file);
        }


        removeImgBtn.addEventListener("click", clearImage);


        function clearImage() {

            currentImageBase64 = null;

            imageInput.value = "";

            imagePreview.src = "";

            imagePreviewContainer.classList.add(
                "hidden"
            );

            removeImgBtn.classList.add(
                "hidden"
            );
        }


        /* =========================================================
           WÜNSCHE RENDERN
        ========================================================= */

        function renderWishes() {

            wishContainer.innerHTML = "";

            const list =
                wishes[currentPerson] || [];


            if (list.length === 0) {

                const empty = document.createElement("div");

                empty.className =
                    "text-center py-12 text-gray-400";

                empty.innerHTML = `
                    <span class="text-4xl block mb-2">🎁</span>
                    Noch keine Wünsche für ${currentPerson}
                    eingetragen.
                `;

                wishContainer.appendChild(empty);

                return;
            }


            list.forEach((item, index) => {

                const card =
                    document
