<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 viewport-fit=cover"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f9fafb">

    <meta name="mobile-web-app-capable" content="yes">

    <title>Wunschliste Bela & Lola</title>

    <style>
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --pink: #ec4899;
            --pink-dark: #db2777;
            --pink-light: #fdf2f8;
            --input: #f9fafb;
            --danger-bg: #fef2f2;
            --danger: #ef4444;
            --shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        html.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --pink: #ec4899;
            --pink-dark: #db2777;
            --pink-light: #3b1f32;
            --input: #111827;
            --danger-bg: #3a2020;
            --danger: #f87171;
            --shadow: 0 8px 30px rgba(0,0,0,.3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
            min-height: 100vh;
            min-height: 100dvh;

            background: var(--bg);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overscroll-behavior: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        input,
        textarea,
        select {
            font-size: 16px;
        }

        button {
            border: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(.97);
        }

        .app {
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                12px 16px
                12px 16px;

            background: rgba(255,255,255,.92);
            border-bottom: 1px solid rgba(229,231,235,.7);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        html.dark header {
            background: rgba(30,41,59,.92);
            border-bottom-color: #334155;
        }

        .header-title {
            margin: 0;

            font-size: 21px;
            font-weight: 800;

            background:
                linear-gradient(90deg, #ec4899, #f59e0b);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--pink-light);
            color: var(--pink-dark);

            font-size: 19px;
        }

        html.dark .icon-button {
            background: #263449;
        }

        /* MAIN */

        main {
            width: 100%;
            max-width: 520px;

            margin: 0 auto;

            padding: 24px 16px 110px;
        }

        /* TABS */

        .tabs {
            display: flex;
            gap: 4px;

            padding: 4px;
            margin-bottom: 20px;

            background: #e5e7eb;
            border-radius: 17px;
        }

        html.dark .tabs {
            background: #1e293b;
        }

        .tab {
            flex: 1;

            padding: 13px 8px;

            border-radius: 13px;

            background: transparent;
            color: #6b7280;

            font-size: 14px;
            font-weight: 800;
        }

        .tab.active {
            background: var(--card);
            color: var(--pink);

            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        /* ADD BUTTON */

        .add-button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 16px;

            margin-bottom: 22px;

            border-radius: 17px;

            background: var(--pink);
            color: white;

            font-size: 15px;
            font-weight: 800;

            box-shadow: 0 8px 22px rgba(236,72,153,.25);
        }

        .add-button span {
            font-size: 21px;
            line-height: 1;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 50px 20px;

            color: var(--muted);
            font-size: 14px;
        }

        .empty-icon {
            display: block;
            margin-bottom: 10px;

            font-size: 42px;
        }

        /* WISH CARD */

        .wish-card {
            position: relative;

            display: flex;
            gap: 14px;

            padding: 16px;

            margin-bottom: 12px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: var(--shadow);
        }

        .wish-image {
            width: 78px;
            height: 78px;

            flex: 0 0 78px;

            object-fit: cover;

            border-radius: 14px;
            background: var(--input);
        }

        .wish-image-placeholder {
            width: 78px;
            height: 78px;

            flex: 0 0 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: var(--pink-light);

            font-size: 28px;
        }

        .wish-content {
            min-width: 0;
            flex: 1;
        }

        .wish-title {
            margin: 0 0 5px;

            font-size: 16px;
            font-weight: 800;

            word-break: break-word;
        }

        .wish-desc {
            margin: 0 0 9px;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.4;

            word-break: break-word;
        }

        .priority {
            display: inline-flex;

            padding: 5px 8px;

            border-radius: 999px;

            background: var(--pink-light);
            color: var(--pink-dark);

            font-size: 11px;
            font-weight: 700;
        }

        .card-actions {
            position: absolute;
            top: 9px;
            right: 9px;

            display: flex;
            gap: 3px;
        }

        .small-button {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: transparent;
            color: var(--muted);

            font-size: 15px;
        }

        .small-button:active {
            background: var(--input);
        }

        .small-button.delete:active {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: none;

            align-items: flex-end;
            justify-content: center;

            padding:
                0
                0
                env(safe-area-inset-bottom);

            background: rgba(0,0,0,.5);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal.open {
            display: flex;
        }

        .modal-panel {
            width: 100%;
            max-width: 520px;

            max-height: 92vh;
            max-height: 92dvh;

            overflow-y: auto;

            padding:
                22px
                20px
                calc(24px + env(safe-area-inset-bottom));

            background: var(--card);

            border-radius: 26px 26px 0 0;

            box-shadow: 0 -10px 40px rgba(0,0,0,.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-title {
            margin: 0;

            font-size: 20px;
            font-weight: 800;
        }

        .close-button {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: var(--input);
            color: var(--muted);

            font-size: 18px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            color: var(--muted);

            font-size: 12px;
            font-weight: 800;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid var(--border);
            border-radius: 13px;

            outline: none;

            background: var(--input);
            color: var(--text);
        }

        textarea {
            min-height: 80px;
            resize: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(236,72,153,.12);
        }

        /* IMAGE */

        .image-row {
            display: flex;
            gap: 9px;
        }

        .image-button {
            flex: 1;

            padding: 13px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: var(--input);
            color: var(--text);

            font-size: 13px;
            font-weight: 700;
        }

        .remove-image {
            display: none;

            padding: 13px;

            border-radius: 13px;

            background: var(--danger-bg);
            color: var(--danger);

            font-size: 13px;
            font-weight: 700;
        }

        .remove-image.visible {
            display: block;
        }

        #image-input {
            display: none;
        }

        .image-preview-container {
            display: none;
            margin-top: 10px;
        }

        .image-preview-container.visible {
            display: block;
        }

        .image-preview {
            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 14px;

            border: 1px solid var(--border);
        }

        /* SAVE */

        .save-button {
            width: 100%;

            padding: 15px;

            margin-top: 4px;

            border-radius: 16px;

            background: var(--pink);
            color: white;

            font-size: 15px;
            font-weight: 800;
        }

        /* TOAST */

        .toast {
            position: fixed;

            left: 50%;
            top: calc(16px + env(safe-area-inset-top));

            z-index: 200;

            transform: translate(-50%, -20px);

            padding: 12px 18px;

            border-radius: 999px;

            background: #111827;
            color: white;

            font-size: 13px;
            font-weight: 700;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity .2s ease,
                transform .2s ease;

            white-space: nowrap;
        }

        html.dark .toast {
            background: white;
            color: #111827;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* iPhone */

        @media (min-width: 600px) {
            .modal {
                align-items: center;
                padding: 20px;
            }

            .modal-panel {
                border-radius: 24px;
                padding-bottom: 24px;
            }
        }
    </style>

    <!--
        APP VERSION

        Wichtig:
        Wenn du später etwas an der App änderst, erhöhe diese Nummer.
        Beispiel: 2.0.0 -> 2.0.1
    -->
    <script>
        (function () {
            const APP_VERSION = "2.0.0";

            try {
                const savedVersion =
                    localStorage.getItem("wishlist_app_version");

                /*
                 * Alte App-Versionen werden nicht gelöscht.
                 * Wir speichern nur die neue Versionsnummer.
                 */
                if (savedVersion !== APP_VERSION) {
                    localStorage.setItem(
                        "wishlist_app_version",
                        APP_VERSION
                    );
                }
            } catch (e) {
                // localStorage kann in seltenen Situationen blockiert sein.
            }

            /*
             * Theme VOR dem sichtbaren Seitenaufbau setzen.
             * Dadurch gibt es beim Start weniger "weißes Aufblitzen".
             */
            try {
                const theme = localStorage.getItem("theme");

                if (
                    theme === "dark" ||
                    (
                        !theme &&
                        window.matchMedia &&
                        window.matchMedia(
                            "(prefers-color-scheme: dark)"
                        ).matches
                    )
                ) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {
                // Fallback: helles Theme
            }
        })();
    </script>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <h1 class="header-title">🎄 Wunschliste</h1>

        <div class="header-actions">
            <button
                type="button"
                id="share-btn"
                class="icon-button"
                aria-label="Wunschliste teilen"
            >
                ↗️
            </button>

            <button
                type="button"
                id="theme-btn"
                class="icon-button"
                aria-label="Dark Mode"
            >
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </header>


    <!-- MAIN -->
    <main>

        <!-- PERSONEN -->
        <div class="tabs">
            <button
                type="button"
                id="tab-bela"
                class="tab active"
            >
                👶 Bela
            </button>

            <button
                type="button"
                id="tab-lola"
                class="tab"
            >
                👧 Lola
            </button>
        </div>


        <!-- NEUER WUNSCH -->
        <button
            type="button"
            id="add-wish-btn"
            class="add-button"
        >
            <span>＋</span>
            Neuen Wunsch hinzufügen
        </button>


        <!-- WÜNSCHE -->
        <div id="wish-container"></div>

    </main>
</div>


<!-- TOAST -->
<div id="toast" class="toast">
    <span id="toast-message"></span>
</div>


<!-- MODAL -->
<div
    id="wish-modal"
    class="modal"
    aria-hidden="true"
>
    <div class="modal-panel">

        <div class="modal-header">
            <h2 id="modal-title" class="modal-title">
                Wunsch hinzufügen
            </h2>

            <button
                type="button"
                id="close-modal-btn"
                class="close-button"
                aria-label="Schließen"
            >
                ✕
            </button>
        </div>


        <input
            type="hidden"
            id="edit-index"
            value="-1"
        >


        <!-- TITEL -->
        <div class="form-group">
            <label for="wish-title">
                Was wird gewünscht?
            </label>

            <input
                type="text"
                id="wish-title"
                autocomplete="off"
                placeholder="z.B. Lego Eisenbahn"
            >
        </div>


        <!-- DETAILS -->
        <div class="form-group">
            <label for="wish-desc">
                Link / Details (optional)
            </label>

            <textarea
                id="wish-desc"
                placeholder="Wo gibt es das? Welche Farbe?"
            ></textarea>
        </div>


        <!-- PRIORITÄT -->
        <div class="form-group">
            <label for="wish-priority">
                Wichtigkeit
            </label>

            <select id="wish-priority">
                <option value="🌟 Top-Wunsch">
                    🌟 Top-Wunsch
                </option>

                <option value="👍 Sehr schön">
                    👍 Sehr schön
                </option>

                <option value="🎁 Wäre nett">
                    🎁 Wäre nett
                </option>
            </select>
        </div>


        <!-- BILD -->
        <div class="form-group">

            <label>
                Foto (optional)
            </label>

            <div class="image-row">

                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                >

                <button
                    type="button"
                    id="choose-image-btn"
                    class="image-button"
                >
                    📷 Foto auswählen / aufnehmen
                </button>

                <button
                    type="button"
                    id="remove-image-btn"
                    class="remove-image"
                >
                    Löschen
                </button>

            </div>


            <div
                id="image-preview-container"
                class="image-preview-container"
            >
                <img
                    id="image-preview"
                    class="image-preview"
                    alt="Vorschau"
                >
            </div>

        </div>


        <!-- SPEICHERN -->
        <button
            type="button"
            id="save-wish-btn"
            class="save-button"
        >
            Speichern
        </button>

    </div>
</div>


<script>
"use strict";


/* ==========================================================
   KONFIGURATION
========================================================== */

const APP_VERSION = "2.0.0";

const STORAGE_KEY = "christmas_wishes";
const THEME_KEY = "theme";


/* ==========================================================
   STATE
========================================================== */

let currentPerson = "Bela";
let currentImageBase64 = null;
let wishes = {
    Bela: [],
    Lola: []
};


/* ==========================================================
   DOM
========================================================== */

const toast =
    document.getElementById("toast");

const toastMessage =
    document.getElementById("toast-message");

const themeBtn =
    document.getElementById("theme-btn");

const themeIcon =
    document.getElementById("theme-icon");

const tabBela =
    document.getElementById("tab-bela");

const tabLola =
    document.getElementById("tab-lola");

const addWishBtn =
    document.getElementById("add-wish-btn");

const wishContainer =
    document.getElementById("wish-container");

const modal =
    document.getElementById("wish-modal");

const modalTitle =
    document.getElementById("modal-title");

const closeModalBtn =
    document.getElementById("close-modal-btn");

const editIndexInput =
    document.getElementById("edit-index");

const wishTitle =
    document.getElementById("wish-title");

const wishDesc =
    document.getElementById("wish-desc");

const wishPriority =
    document.getElementById("wish-priority");

const imageInput =
    document.getElementById("image-input");

const chooseImageBtn =
    document.getElementById("choose-image-btn");

const removeImageBtn =
    document.getElementById("remove-image-btn");

const imagePreviewContainer =
    document.getElementById("image-preview-container");

const imagePreview =
    document.getElementById("image-preview");

const saveWishBtn =
    document.getElementById("save-wish-btn");

const shareBtn =
    document.getElementById("share-btn");


/* ==========================================================
   START
========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);


function init() {
    wishes = loadWishes();

    initThemeIcon();

    updateTabs();

    renderWishes();

    bindEvents();
}


/* ==========================================================
   EVENTS
========================================================== */

function bindEvents() {

    themeBtn.addEventListener(
        "click",
        toggleTheme
    );

    tabBela.addEventListener(
        "click",
        () => setPerson("Bela")
    );

    tabLola.addEventListener(
        "click",
        () => setPerson("Lola")
    );

    addWishBtn.addEventListener(
        "click",
        openAddModal
    );

    closeModalBtn.addEventListener(
        "click",
        closeModal
    );

    saveWishBtn.addEventListener(
        "click",
        saveWish
    );

    chooseImageBtn.addEventListener(
        "click",
        () => imageInput.click()
    );

    imageInput.addEventListener(
        "change",
        handleImageUpload
    );

    removeImageBtn.addEventListener(
        "click",
        clearImage
    );

    shareBtn.addEventListener(
        "click",
        shareWishlist
    );

    modal.addEventListener(
        "click",
        function (event) {
            if (event.target === modal) {
                closeModal();
            }
        }
    );
}


/* ==========================================================
   THEME
========================================================== */

function initThemeIcon() {

    const isDark =
        document.documentElement.classList.contains("dark");

    themeIcon.textContent =
        isDark ? "☀️" : "🌙";
}


function toggleTheme() {

    const html =
        document.documentElement;

    const isDark =
        html.classList.toggle("dark");

    try {
        localStorage.setItem(
            THEME_KEY,
            isDark ? "dark" : "light"
        );
    } catch (error) {
        console.warn(
            "Theme konnte nicht gespeichert werden.",
            error
        );
    }

    themeIcon.textContent =
        isDark ? "☀️" : "🌙";
}


/* ==========================================================
   STORAGE
========================================================== */

function loadWishes() {

    const emptyData = {
        Bela: [],
        Lola: []
    };

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return emptyData;
        }

        const parsed =
            JSON.parse(saved);

        return {
            Bela:
                Array.isArray(parsed.Bela)
                    ? parsed.Bela
                    : [],

            Lola:
                Array.isArray(parsed.Lola)
                    ? parsed.Lola
                    : []
        };

    } catch (error) {

        console.warn(
            "Wünsche konnten nicht geladen werden.",
            error
        );

        return emptyData;
    }
}


function saveWishes() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(wishes)
        );

        return true;

    } catch (error) {

        console.error(
            "Speichern fehlgeschlagen:",
            error
        );

        showToast(
            "Speichern fehlgeschlagen."
        );

        return false;
    }
}


/* ==========================================================
   TOAST
========================================================== */

let toastTimer = null;


function showToast(message) {

    clearTimeout(toastTimer);

    toastMessage.textContent =
        message;

    toast.classList.add("show");

    toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 2400);
}


/* ==========================================================
   PERSONEN
========================================================== */

function setPerson(person) {

    currentPerson = person;

    updateTabs();

    renderWishes();
}


function updateTabs() {

    tabBela.classList.toggle(
        "active",
        currentPerson === "Bela"
    );

    tabLola.classList.toggle(
        "active",
        currentPerson === "Lola"
    );
}


/* ==========================================================
   MODAL
========================================================== */

function openAddModal() {

    modalTitle.textContent =
        "Wunsch hinzufügen";

    editIndexInput.value =
        "-1";

    wishTitle.value =
        "";

    wishDesc.value =
        "";

    wishPriority.value =
        "🌟 Top-Wunsch";

    clearImage();

    modal.classList.add("open");

    modal.setAttribute(
        "aria-hidden",
        "false"
    );

    setTimeout(() => {
        wishTitle.focus();
    }, 50);
}


function openEditModal(index) {

    const item =
        wishes[currentPerson][index];

    if (!item) {
        return;
    }

    modalTitle.textContent =
        "Wunsch bearbeiten";

    editIndexInput.value =
        String(index);

    wishTitle.value =
        item.title || "";

    wishDesc.value =
        item.desc || "";

    wishPriority.value =
        item.priority ||
        "🌟 Top-Wunsch";

    currentImageBase64 =
        item.image || null;

    if (currentImageBase64) {

        imagePreview.src =
            currentImageBase64;

        imagePreviewContainer.classList.add(
            "visible"
        );

        removeImageBtn.classList.add(
            "visible"
        );

    } else {

        imagePreview.src =
            "";

        imagePreviewContainer.classList.remove(
            "visible"
        );

        removeImageBtn.classList.remove(
            "visible"
        );
    }

    modal.classList.add("open");

    modal.setAttribute(
        "aria-hidden",
        "false"
    );

    setTimeout(() => {
        wishTitle.focus();
    }, 50);
}


function closeModal() {

    modal.classList.remove(
        "open"
    );

    modal.setAttribute(
        "aria-hidden",
        "true"
    );
}


/* ==========================================================
   BILD
========================================================== */

function handleImageUpload(event) {

    const file =
        event.target.files &&
        event.target.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        showToast(
            "Bitte ein Bild auswählen."
        );

        imageInput.value = "";

        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function (readerEvent) {

            const img =
                new Image();

            img.onload =
                function () {

                    const MAX_SIZE = 900;

                    let width =
                        img.width;

                    let height =
                        img.height;

                    if (
                        width > MAX_SIZE ||
                        height > MAX_SIZE
                    ) {

                        if (width > height) {

                            height =
                                Math.round(
                                    height *
                                    MAX_SIZE /
                                    width
                                );

                            width =
                                MAX_SIZE;

                        } else {

                            width =
                                Math.round(
                                    width *
                                    MAX_SIZE /
                                    height
                                );

                            height =
                                MAX_SIZE;
                        }
                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    if (!ctx) {

                        showToast(
                            "Bild konnte nicht verarbeitet werden."
                        );

                        return;
                    }

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    currentImageBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );

                    imagePreview.src =
                        currentImageBase64;

                    imagePreviewContainer.classList.add(
                        "visible"
                    );

                    removeImageBtn.classList.add(
                        "visible"
                    );
                };

            img.onerror =
                function () {
                    showToast(
                        "Bild konnte nicht geladen werden."
                    );
                };

            img.src =
                readerEvent.target.result;
        };

    reader.onerror =
        function () {
            showToast(
                "Bild konnte nicht gelesen werden."
            );
        };

    reader.readAsDataURL(file);
}


function clearImage() {

    currentImageBase64 =
        null;

    imageInput.value =
        "";

    imagePreview.src =
        "";

    imagePreviewContainer.classList.remove(
        "visible"
    );

    removeImageBtn.classList.remove(
        "visible"
    );
}


/* ==========================================================
   WUNSCH SPEICHERN
========================================================== */

function saveWish() {

    const title =
        wishTitle.value.trim();

    const desc =
        wishDesc.value.trim();

    const priority =
        wishPriority.value;

    if (!title) {

        showToast(
            "Bitte einen Wunsch eingeben."
        );

        wishTitle.focus();

        return;
    }

    const index =
        Number(
            editIndexInput.value
        );

    const item = {
        title: title,
        desc: desc,
        priority: priority,
        image: currentImageBase64
    };

    if (
        Number.isInteger(index) &&
        index >= 0 &&
        index < wishes[currentPerson].length
    ) {

        wishes[currentPerson][index] =
            item;

        showToast(
            "Wunsch aktualisiert."
        );

    } else {

        wishes[currentPerson].push(
            item
        );

        showToast(
            "Wunsch gespeichert."
        );
    }

    if (!saveWishes()) {
        return;
    }

    renderWishes();

    closeModal();
}


/* ==========================================================
   WÜNSCHE RENDERN
========================================================== */

function renderWishes() {

    wishContainer.innerHTML =
        "";

    const list =
        wishes[currentPerson] ||
        [];

    if (list.length === 0) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty";

        const icon =
            document.createElement(
                "span"
            );

        icon.className =
            "empty-icon";

        icon.textContent =
            "🎁";

        const text =
            document.createElement(
                "div"
            );

        text.textContent =
            `Noch keine Wünsche für ${currentPerson} eingetragen.`;

        empty.appendChild(
            icon
        );

        empty.appendChild(
            text
        );

        wishContainer.appendChild(
            empty
        );

        return;
    }

    list.forEach(
        (item, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "wish-card";


            /* BILD */

            if (item.image) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "wish-image";

                img.src =
                    item.image;

                img.alt =
                    item.title || "Wunsch";

                card.appendChild(
                    img
                );

            } else {

                const placeholder =
                    document.createElement(
                        "div"
                    );

                placeholder.className =
                    "wish-image-placeholder";

                placeholder.textContent =
                    "🎁";

                card.appendChild(
                    placeholder
                );
            }


            /* CONTENT */

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "wish-content";


            const title =
                document.createElement(
                    "h3"
                );

            title.className =
                "wish-title";

            title.textContent =
                item.title || "";

            content.appendChild(
                title
            );


            if (item.desc) {

                const desc =
                    document.createElement(
                        "p"
                    );

                desc.className =
                    "wish-desc";

                desc.textContent =
                    item.desc;

                content.appendChild(
                    desc
                );
            }


            if (item.priority) {

                const priority =
                    document.createElement(
                        "span"
                    );

                priority.className =
                    "priority";

                priority.textContent =
                    item.priority;

                content.appendChild(
                    priority
                );
            }

            card.appendChild(
                content
            );


            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "card-actions";


            const editBtn =
                document.createElement(
                    "button"
                );

            editBtn.type =
                "button";

            editBtn.className =
                "small-button";

            editBtn.textContent =
                "✏️";

            editBtn.setAttribute(
                "aria-label",
                "Wunsch bearbeiten"
            );

            editBtn.addEventListener(
                "click",
                function () {
                    openEditModal(index);
                }
            );


            const deleteBtn =
                document.createElement(
                    "button"
                );

            deleteBtn.type =
                "button";

            deleteBtn.className =
                "small-button delete";

            deleteBtn.textContent =
                "🗑️";

            deleteBtn.setAttribute(
                "aria-label",
                "Wunsch löschen"
            );

            deleteBtn.addEventListener(
                "click",
                function () {
                    deleteWish(index);
                }
            );


            actions.appendChild(
                editBtn
            );

            actions.appendChild(
                deleteBtn
            );

            card.appendChild(
                actions
            );


            wishContainer.appendChild(
                card
            );
        }
    );
}


/* ==========================================================
   LÖSCHEN
========================================================== */

function deleteWish(index) {

    const item =
        wishes[currentPerson][index];

    if (!item) {
        return;
    }

    const confirmed =
        window.confirm(
            `„${item.title}“ wirklich löschen?`
        );

    if (!confirmed) {
        return;
    }

    wishes[currentPerson].splice(
        index,
        1
    );

    saveWishes();

    renderWishes();

    showToast(
        "Wunsch gelöscht."
    );
}


/* ==========================================================
   TEILEN
========================================================== */

async function shareWishlist() {

    const data =
        createShareText();

    if (
        navigator.share
    ) {

        try {

            await navigator.share({
                title:
                    "Wunschliste Bela & Lola",

                text:
                    data
            });

            return;

        } catch (error) {

            /*
             * Abbrechen beim iPhone-Share-Sheet
             * ist kein Fehler.
             */
            if (
                error &&
                error.name === "AbortError"
            ) {
                return;
            }
        }
    }

    try {

        await navigator.clipboard.writeText(
            data
        );

        showToast(
            "Wunschliste kopiert."
        );

    } catch (error) {

        showToast(
            "Teilen nicht möglich."
        );
    }
}


function createShareText() {

    let text =
        "🎄 Wunschliste Bela & Lola\n\n";

    for (
        const person of ["Bela", "Lola"]
    ) {

        text +=
            `${person}:\n`;

        const list =
            wishes[person] || [];

        if (list.length === 0) {

            text +=
                "– Keine Wünsche\n\n";

            continue;
        }

        list.forEach(
            item => {

                text +=
                    `• ${item.title}`;

                if (item.priority) {
                    text +=
                        ` (${item.priority})`;
                }

                if (item.desc) {
                    text +=
                        `\n  ${item.desc}`;
                }

                text +=
                    "\n";
            }
        );

        text +=
            "\n";
    }

    return text;
}


/* ==========================================================
   ESC = MODAL SCHLIESSEN
========================================================== */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {
            closeModal();
        }
    }
);
