<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wunschliste Bela & Lola</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom); 
            -webkit-tap-highlight-color: transparent; 
        }
        input, textarea, select { font-size: 16px !important; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .dark .glass-header { background: rgba(30, 41, 59, 0.85); border-bottom: 1px solid #334155; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-gray-800 text-white dark:bg-white dark:text-gray-900 px-5 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 transform -translate-y-4 text-sm font-medium whitespace-nowrap">
        <span id="toast-msg"></span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 glass-header px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-500 to-amber-500">🎄 Wunschliste</h1>
        <div class="flex items-center gap-3">
            <button onclick="exportWishlist()" class="p-2 rounded-full bg-brand-50 dark:bg-dark-card text-brand-600 dark:text-brand-500 shadow-sm" aria-label="Teilen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            </button>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 shadow-sm" aria-label="Dark Mode">
                <span id="theme-icon" class="text-lg">🌙</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full flex flex-col pb-24">
        
        <!-- Personen Umschalter -->
        <div class="flex bg-gray-200 dark:bg-dark-card p-1 rounded-2xl mb-6 shadow-inner">
            <button onclick="setPerson('Bela')" id="tab-bela" class="flex-1 py-3 rounded-xl font-bold text-sm transition-all shadow-sm">👶 Bela</button>
            <button onclick="setPerson('Lola')" id="tab-lola" class="flex-1 py-3 rounded-xl font-bold text-sm transition-all">👧 Lola</button>
        </div>

        <!-- Wunsch hinzufügen Button -->
        <button onclick="openModal()" class="w-full py-4 mb-6 bg-brand-500 text-white rounded-2xl font-bold shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 active:scale-95 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Neuen Wunsch hinzufügen
        </button>

        <!-- Liste der Wünsche -->
        <div id="wish-container" class="flex flex-col gap-3">
            <!-- Wünsche werden hier eingefügt -->
        </div>
    </main>

    <!-- Modal für Wunsch hinzufügen -->
    <div id="wish-modal" class="fixed inset-0 z-40 hidden bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-dark-card w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-xl font-bold">Wunsch hinzufügen</h2>
                <button onclick="closeModal()" class="text-gray-400 p-2">✕</button>
            </div>
            
            <input type="hidden" id="edit-index" value="-1">
            
            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Was wird gewünscht?</label>
                    <input type="text" id="wish-title" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-800 border dark:border-dark-border focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="z.B. Lego Eisenbahn">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Link / Details (optional)</label>
                    <textarea id="wish-desc" rows="2" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-800 border dark:border-dark-border resize-none focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Wo gibt es das? Welche Farbe?"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Wichtigkeit</label>
                    <select id="wish-priority" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-800 border dark:border-dark-border focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <option value="🌟 Top-Wunsch">🌟 Top-Wunsch</option>
                        <option value="👍 Sehr schön">👍 Sehr schön</option>
                        <option value="🎁 Wäre nett">🎁 Wäre nett</option>
                    </select>
                </div>
            </div>

            <button onclick="saveWish()" class="w-full py-3.5 bg-brand-500 text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">Speichern</button>
        </div>
    </div>

    <script>
        let currentPerson = 'Bela';
        let wishes = JSON.parse(localStorage.getItem('christmas_wishes') || '{"Bela": [], "Lola": []}');

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderWishes();
        });

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('theme-icon').innerText = '🌙';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('theme-icon').innerText = '☀️';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }

        function setPerson(person) {
            currentPerson = person;
            document.getElementById('tab-bela').className = person === 'Bela' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-white dark:bg-dark-card shadow-sm text-brand-500' : 'flex-1 py-3 rounded-xl font-bold text-sm text-gray-500';
            document.getElementById('tab-lola').className = person === 'Lola' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-white dark:bg-dark-card shadow-sm text-brand-500' : 'flex-1 py-3 rounded-xl font-bold text-sm text-gray-500';
            renderWishes();
        }

        function renderWishes() {
            const container = document.getElementById('wish-container');
            container.innerHTML = '';
            
            let list = wishes[currentPerson] || [];

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <span class="text-4xl block mb-2">🎁</span>
                        Noch keine Wünsche für ${currentPerson} eingetragen.
                    </div>
                `;
                return;
            }

            list.forEach((item, index) => {
                container.innerHTML += `
                    <div class="bg-white dark:bg-dark-card rounded-2xl p-4 shadow-sm flex items-start justify-between gap-3 border ${item.done ? 'border-green-500/50 bg-green-50/20' : 'border-transparent dark:border-dark-border'}">
                        <div class="flex items-start gap-3 flex-1">
                            <input type="checkbox" ${item.done ? 'checked' : ''} onclick="toggleDone(${index})" class="w-5 h-5 mt-1 rounded text-brand-500 focus:ring-brand-500 cursor-pointer">
                            <div class="flex flex-col flex-1">
                                <span class="font-bold text-gray-800 dark:text-gray-100 ${item.done ? 'line-through text-gray-400' : ''}">${item.title}</span>
                                ${item.desc ? `<span class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${item.desc}</span>` : ''}
                                <span class="text-xs font-semibold text-brand-500 mt-2">${item.priority}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="editWish(${index})" class="p-2 text-gray-400 hover:text-gray-600">✏️</button>
                            <button onclick="deleteWish(${index})" class="p-2 text-gray-400 hover:text-red-500">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index = -1) {
            document.getElementById('edit-index').value = index;
            if (index >= 0) {
                let item = wishes[currentPerson][index];
                document.getElementById('modal-title').innerText = 'Wunsch bearbeiten';
                document.getElementById('wish-title').value = item.title;
                document.getElementById('wish-desc').value = item.desc || '';
                document.getElementById('wish-priority').value = item.priority;
            } else {
                document.getElementById('modal-title').innerText = 'Wunsch hinzufügen';
                document.getElementById('wish-title').value = '';
                document.getElementById('wish-desc').value = '';
                document.getElementById('wish-priority').value = '🌟 Top-Wunsch';
            }
            document.getElementById('wish-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('wish-modal').classList.add('hidden');
        }

        function saveWish() {
            let title = document.getElementById('wish-title').value.trim();
            if (!title) {
                showToast('Bitte gib einen Wunsch ein!');
                return;
            }
            let desc = document.getElementById('wish-desc').value.trim();
            let priority = document.getElementById('wish-priority').value;
            let index = parseInt(document.getElementById('edit-index').value);

            if (index >= 0) {
                wishes[currentPerson][index].title = title;
                wishes[currentPerson][index].desc = desc;
                wishes[currentPerson][index].priority = priority;
            } else {
                if (!wishes[currentPerson]) wishes[currentPerson] = [];
                wishes[currentPerson].push({ title, desc, priority, done: false });
            }

            localStorage.setItem('christmas_wishes', JSON.stringify(wishes));
            closeModal();
            renderWishes();
            showToast('Wunsch gespeichert!');
        }

        function toggleDone(index) {
            wishes[currentPerson][index].done = !wishes[currentPerson][index].done;
            localStorage.setItem('christmas_wishes', JSON.stringify(wishes));
            renderWishes();
        }

        function editWish(index) {
            openModal(index);
        }

        function deleteWish(index) {
            if (confirm('Wunsch wirklich löschen?')) {
                wishes[currentPerson].splice(index, 1);
                localStorage.setItem('christmas_wishes', JSON.stringify(wishes));
                renderWishes();
                showToast('Wunsch gelöscht');
            }
        }

        function exportWishlist() {
            let text = `🎄 WEIHNACHTS-WUNSCHLISTE 🎄\n\n`;
            ['Bela', 'Lola'].forEach(p => {
                text += `--- ${p.toUpperCase()} ---\n`;
                let list = wishes[p] || [];
                if (list.length === 0) text += `(Keine Wünsche)\n`;
                list.forEach((w, i) => {
                    text += `${i+1}. [${w.done ? 'X' : ' '}] ${w.title} (${w.priority})\n`;
                    if (w.desc) text += `   Info: ${w.desc}\n`;
                });
                text += `\n`;
            });

            if (navigator.share) {
                navigator.share({ title: 'Weihnachts-Wunschliste', text: text }).catch(() => {});
            } else {
                let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = `Wunschliste_Bela_Lola.txt`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Wunschliste exportiert!');
            }
        }
    </script>
</body>
</html>
